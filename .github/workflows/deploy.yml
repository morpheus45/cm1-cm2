name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Une pull request doit être vérifiée avant d'être fusionnée : sans ce
  # déclencheur, rien ne lançait les tests tant que le code n'était pas
  # déjà sur master.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un nouveau push sur une branche annule la vérification devenue inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Les deux valeurs viennent des secrets du dépôt. Absentes, l'application
      # fonctionne comme aujourd'hui, tout sur l'appareil. La clé
      # « publishable » (sb_publishable_…) est faite pour être lisible dans le
      # code du site : ce sont les règles d'accès de la base qui protègent les
      # données. La clé « secret » (sb_secret_…), elle, ne doit jamais y figurer.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Les règles d'accès protègent des noms et des résultats d'enfants : elles
  # sont vérifiées sur un vrai PostgreSQL à chaque changement, pas relues à
  # l'œil. Le test échoue dès qu'une protection est retirée.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/lancer.sh

  deploy:
    needs: [build, schema]
    # Une pull request se vérifie, elle ne se publie pas.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Les publications vers Pages restent sérialisées, et une publication en
    # cours ne s'annule pas.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
