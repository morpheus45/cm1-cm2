name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Une pull request doit être vérifiée avant d'être fusionnée : sans ce
  # déclencheur, rien ne lançait les tests tant que le code n'était pas
  # déjà sur master.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un nouveau push sur une branche annule la vérification devenue inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La bibliothèque de Supabase demande Node 22 au moins ; Node 20
          # n'est plus suivi depuis avril 2026.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Dit, sans jamais l'afficher, si la clé Supabase est bien en place :
      # l'avertissement apparaît en tête du résumé de la vérification. La clé
      # publique n'ayant rien de secret, une « variable » du dépôt convient
      # aussi bien qu'un « secret ».
      - name: Clé Supabase en place ?
        env:
          KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          case "$KEY" in
            '') echo "::warning::Pas de secret VITE_SUPABASE_PUBLISHABLE_KEY : le site fonctionnera sans la mise en commun avec la maîtresse." ;;
            sb_publishable_*) echo "::notice::Clé publique Supabase en place." ;;
            sb_secret_*) echo "::error::Le secret VITE_SUPABASE_PUBLISHABLE_KEY contient la clé SECRÈTE : remplacez-la par la clé publishable." ;;
            *) echo "::notice::Clé Supabase en place (ancien format)." ;;
          esac
      # L'adresse du projet n'a rien de secret : chaque requête du site la
      # montre. La clé « publishable » (sb_publishable_…) est faite, elle
      # aussi, pour être lisible dans le code du site : ce sont les règles
      # d'accès de la base qui protègent les données. Elle vient malgré tout
      # d'un secret du dépôt, pour qu'on puisse la changer sans toucher au
      # code. Une clé secrète fait échouer le build (vite.config.ts).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://uexxvndxlnwjvlgdkxwc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Les règles d'accès protègent des noms et des résultats d'enfants : elles
  # sont vérifiées sur un vrai PostgreSQL à chaque changement, pas relues à
  # l'œil. Le test échoue dès qu'une protection est retirée.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/lancer.sh

  # La fonction du chat avec Claude tourne dans Supabase, pas dans le site :
  # on vérifie au moins qu'elle se compile avec les bibliothèques officielles
  # (Anthropic, Supabase) aux versions qu'elle déclare.
  fonction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none supabase/functions/assistant-problemes/index.ts

  deploy:
    needs: [build, schema, fonction]
    # Une pull request se vérifie, elle ne se publie pas.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Les publications vers Pages restent sérialisées, et une publication en
    # cours ne s'annule pas.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
